name: Build Pure Linux Stage 1 (Dandelion)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio gzip wget curl python2 python3 git device-tree-compiler
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Initramfs
        run: |
          chmod +x build_initramfs.sh
          ./build_initramfs.sh

      - name: Clone Dandelion Kernel Source
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss kernel

      - name: Patch Legacy Kernel Build Issues
        working-directory: kernel
        run: |
          sed -i 's/-Werror//g' Makefile scripts/Makefile.build 2>/dev/null || true

          python3 -c '
          import re
          from pathlib import Path

          xts = Path("crypto/xts.c")
          if xts.exists():
              src = xts.read_text(encoding="utf-8", errors="ignore")
              src = re.sub(r"\bfree\b", "dandelion_xts_free", src)
              src = re.sub(r"\.dandelion_xts_free\b", ".free", src)
              xts.write_text(src, encoding="utf-8")

          kpd = Path("drivers/input/keyboard/mediatek/kpd.c")
          if kpd.exists():
              kpd_src = kpd.read_text(encoding="utf-8", errors="ignore")
              kpd_src = re.sub(r"(kpdpwr_reset_store[\s\S]*?)%d([\s\S]*?kpdpwr_status)", r"\1%lu\2", kpd_src, count=1)
              kpd.write_text(kpd_src, encoding="utf-8")

          ft_dir = Path("drivers/input/touchscreen/mediatek/ft8006s_spi")
          ft_cfg = ft_dir / "focaltech_config.h"
          if ft_cfg.exists():
              cfg_src = ft_cfg.read_text(encoding="utf-8", errors="ignore")
              if re.search(r"#define\s+FTS_AUTO_UPGRADE_EN\b", cfg_src):
                  cfg_src = re.sub(r"#define\s+FTS_AUTO_UPGRADE_EN[^\n]*", "#define FTS_AUTO_UPGRADE_EN 0", cfg_src)
              elif "FTS_AUTO_UPGRADE_EN" in cfg_src:
                  cfg_src = re.sub(r"/\*[^\n]*FTS_AUTO_UPGRADE_EN[^\n]*\*/", "#define FTS_AUTO_UPGRADE_EN 0", cfg_src)
              else:
                  cfg_src += "\n#define FTS_AUTO_UPGRADE_EN 0\n"
              ft_cfg.write_text(cfg_src, encoding="utf-8")

              inc_files = set(re.findall(r"[\"'\'']([^\"'\'']+\.i)[\"'\'']", cfg_src))
              inc_files.update(["include/firmware/fw_helitai_v0e.i", "include/firmware/fw_sample.i"])
              stub_bytes = "0x00, 0x00, 0x00, 0x00\n"
              for rel in inc_files:
                  for base in [Path("."), ft_dir]:
                      target = base / rel
                      if not target.exists():
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_text(stub_bytes, encoding="utf-8")
          '

          STUB_HDR_DIR="include/mtk_compat_stubs"
          mkdir -p "$STUB_HDR_DIR"
          for hdr in helio-dvfsrc.h mrdump_panic.h autok.h; do
            if [ -z "$(find drivers sound include -name "$hdr" 2>/dev/null | head -n 1)" ]; then
              printf "/* Auto stub for %s */\n" "$hdr" > "$STUB_HDR_DIR/$hdr"
            fi
          done

      - name: Configure Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make HOSTCFLAGS="-fcommon" PYTHON=python2 dandelion_defconfig

          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR
          ./scripts/config --enable CONFIG_CC_STACKPROTECTOR_NONE || true

          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_VT
          ./scripts/config --enable CONFIG_VT_CONSOLE
          ./scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          ./scripts/config --enable CONFIG_USB_CONFIGFS
          ./scripts/config --enable CONFIG_USB_CONFIGFS_RNDIS

          ./scripts/config --disable CONFIG_SECURITY_SELINUX
          ./scripts/config --disable CONFIG_ANDROID_PARANOID_NETWORK

          make HOSTCFLAGS="-fcommon" PYTHON=python2 olddefconfig

      - name: Compile Kernel Image & DTB
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          EXTRA_INC="-I$(pwd)/drivers/input/touchscreen/mediatek/ft8006s_spi -I$(pwd)/include/mtk_compat_stubs"
          for hdr in helio-dvfsrc.h mrdump_panic.h autok.h; do
            for d in $(find drivers sound include -name "$hdr" -exec dirname {} \; 2>/dev/null | sort -u); do
              EXTRA_INC="$EXTRA_INC -I$(pwd)/$d"
            done
          done
          KCFLAGS="-w $EXTRA_INC"
          make -j$(nproc) HOSTCFLAGS="-fcommon" PYTHON=python2 KCFLAGS="$KCFLAGS" Image.gz-dtb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-pure-linux-stage1
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            initramfs.cpio.gz
