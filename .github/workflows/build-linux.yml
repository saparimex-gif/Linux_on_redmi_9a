name: Build Pure Linux Stage 1 (Dandelion)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio gzip wget curl python2 python3 git device-tree-compiler
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Initramfs
        run: |
          chmod +x build_initramfs.sh
          ./build_initramfs.sh

      - name: Clone Dandelion Kernel Source
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss kernel

      - name: Patch Legacy Kernel Build Issues
        working-directory: kernel
        run: |
          python3 -c '
          import re
          from pathlib import Path
          xts = Path("crypto/xts.c")
          if xts.exists():
              src = xts.read_text(encoding="utf-8", errors="ignore")
              src = re.sub(r"\bfree\b", "dandelion_xts_free", src)
              src = re.sub(r"\.dandelion_xts_free\b", ".free", src)
              xts.write_text(src, encoding="utf-8")
          kpd = Path("drivers/input/keyboard/mediatek/kpd.c")
          if kpd.exists():
              kpd_src = kpd.read_text(encoding="utf-8", errors="ignore")
              kpd_src = re.sub(r"(kpdpwr_reset_store[\s\S]*?)%d([\s\S]*?kpdpwr_status)", r"\1%lu\2", kpd_src, count=1)
              kpd.write_text(kpd_src, encoding="utf-8")
          '
          mkdir -p include/firmware
          if [ ! -f include/firmware/fw_helitai_v0e.i ]; then
            printf "static const unsigned char fts_fw_data[] = { 0x00 };\n" > include/firmware/fw_helitai_v0e.i
          fi
          DVFSRC_HDR=$(find drivers sound include -name "helio-dvfsrc.h" 2>/dev/null | head -n 1 || true)
          if [ -n "$DVFSRC_HDR" ]; then
            HDR_DIR=$(dirname "$DVFSRC_HDR")
            echo "Found helio-dvfsrc.h in: $HDR_DIR"
            sed -i "s|#include \"helio-dvfsrc.h\"|#include <helio-dvfsrc.h>|g" drivers/devfreq/helio-dvfsrc-opp.c 2>/dev/null || true
            sed -i "s|ccflags-y +=|ccflags-y += -I\$(srctree)/$HDR_DIR|g" drivers/devfreq/Makefile 2>/dev/null || true
          fi

      - name: Configure Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make HOSTCFLAGS="-fcommon" PYTHON=python2 dandelion_defconfig
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_VT
          ./scripts/config --enable CONFIG_VT_CONSOLE
          ./scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          ./scripts/config --enable CONFIG_USB_CONFIGFS
          ./scripts/config --enable CONFIG_USB_CONFIGFS_RNDIS
          ./scripts/config --disable CONFIG_SECURITY_SELINUX
          ./scripts/config --disable CONFIG_ANDROID_PARANOID_NETWORK
          if [ -z "$(find . -name 'helio-dvfsrc.h' 2>/dev/null | head -n 1)" ]; then
            ./scripts/config --disable CONFIG_MTK_DVFSRC_OPP
          fi
          make HOSTCFLAGS="-fcommon" PYTHON=python2 olddefconfig

      - name: Compile Kernel Image & DTB
        working-directory: kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          EXTRA_INC=""
          for d in $(find drivers sound include -name "helio-dvfsrc.h" -exec dirname {} \; 2>/dev/null | sort -u); do
            EXTRA_INC="$EXTRA_INC -I$(pwd)/$d"
          done
          KCFLAGS="-Wno-array-bounds -Wno-attribute-alias -Wno-packed-not-aligned -Wno-stringop-overflow -Wno-zero-length-bounds -Wno-address-of-packed-member -Wno-restrict -Wno-misleading-indentation -Wno-format-overflow -Wno-builtin-declaration-mismatch -Wno-unused-function -Wno-maybe-uninitialized -Wno-format -Wno-error $EXTRA_INC"
          make -j$(nproc) HOSTCFLAGS="-fcommon" PYTHON=python2 KCFLAGS="$KCFLAGS" Image.gz-dtb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-pure-linux-stage1
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            initramfs.cpio.gz
